name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # PyYAML has no Python 3.15 wheel yet; its optional C extension is unnecessary here.
      PYYAML_FORCE_LIBYAML: "0"
      # Disposable service-container credentials; never a development or production database.
      TEST_DATABASE_URL: postgresql+psycopg://pipeline_test:local-test-only@127.0.0.1:5433/pipeline_assistant_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pipeline_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: pipeline_assistant_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pipeline_test -d pipeline_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev,ai]"
          python -m pip check

      - name: Run tests
        run: python -m pytest -ra

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types and build
        run: npm run build
